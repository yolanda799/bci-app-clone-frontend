<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilo/style.css">
    
    <title>BCI</title>
</head>
<body>
    <header>
        <div class="topBar" style="background:#fba91b;">
            <h1>VAI DAKI</h1>
           <div class="botao">
                <select id="idioma">
                <option value="en">EN</option>
                <option value="pt">PT</option>
                <option value="mand">MANDARIM</option>
            </select>
        </div>

            <div class="img">
                <img src="imagem/OIP (5).webp" alt="Logo">
            </div>
        </div>
    </header>

    <main>
        <div class="logo">
            <span>Bem - Vindo</span>
        </div>

        <div class="inicio">
            <span class="ativo">Particular</span>
            <span>Empresa</span>
        </div>

        <div class="conteudo">
            <input placeholder="Nome do Utilizador" type="text">
       </div>

        <div class="acesso">
            <input placeholder="Acesso" type="password">
        </div>

        <div class="botaoConf">
            <span>Confirmar</span>
        </div>

        <div class="para">
            <span>Esqueceu suas credenciais ou pretende reactivar o eBancking?</span>
            <a href="#" style="color: #fba91b; ">clique aqui</a>
        </div>
        <div class="imag">
            <img src="imagem/OIP (7).webp" alt="Imagem decorativa">
        </div>
    </main>

    <footer>
        

        <div class="icon">
            <span class="material-symbols-outlined">home</span>
            <span class="material-symbols-outlined">contacts</span>
            <span class="material-symbols-outlined">lock</span>
            <span class="material-symbols-outlined">sync_alt</span>
            <span class="material-symbols-outlined">location_on</span>
            <span class="material-symbols-outlined">add_ic_call</span>
        </div>
    </footer>
</body>
</html>
